<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Probe — per-cell frame boxes on plate 626 (NGA 136536, 1920px thumb)</title>
<style>
  body{margin:0;background:#111;color:#eee;font:12px/1.5 ui-monospace,monospace}
  h2{margin:0;padding:12px 16px;font-size:14px}
  pre{margin:0;padding:12px 16px;white-space:pre-wrap;background:#000}
  .wrap{position:relative;width:1920px;margin:0 0 24px}
  .wrap img{display:block;width:1920px}
  .cell{position:absolute;border:2px solid #ff5a1f;box-sizing:border-box}
  .cell i{position:absolute;left:4px;top:2px;color:#ff5a1f;font-style:normal;font-size:22px;text-shadow:0 0 4px #000}
  .sheet{display:grid;grid-template-columns:repeat(4,460px);gap:12px;padding:12px}
  .crop{width:460px;aspect-ratio:465/330;background-repeat:no-repeat;position:relative;outline:1px solid #444}
  .crop b{position:absolute;left:6px;top:4px;color:#ff5a1f;font-size:26px;text-shadow:0 0 4px #000}
</style>
<body>
<h2>Per-cell boxes, fractions of the 1920×1482 thumb. Threshold = min + 0.25·range inside each search window.</h2>
<pre id="out">loading…</pre>
<div class="wrap" id="wrap"><img id="im" crossorigin="anonymous" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Eadweard_Muybridge%2C_Animal_Locomotion%2C_Plate_626%2C_1887%2C_NGA_136536.jpg/1920px-Eadweard_Muybridge%2C_Animal_Locomotion%2C_Plate_626%2C_1887%2C_NGA_136536.jpg"></div>
<h2>The sixteen cells cut with those boxes, 460px wide each</h2>
<div class="sheet" id="sheet"></div>
<script>
(function(){
  var out = document.getElementById('out'), log = [];
  function say(s){ log.push(s); out.textContent = log.join('\n'); }
  var img = document.getElementById('im');

  function go(){
    var w = img.naturalWidth, h = img.naturalHeight;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
    var data;
    try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { say('canvas tainted: ' + e.message); return; }
    say('natural ' + w + 'x' + h);
    function lum(x, y){ var i = (y * w + x) * 4; return 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2]; }
    // mean luminance per column within [y0,y1), per row within [x0,x1)
    function colProfile(x0, x1, y0, y1){ var p = []; for (var x = x0; x < x1; x++){ var s = 0; for (var y = y0; y < y1; y++) s += lum(x, y); p.push(s / (y1 - y0)); } return p; }
    function rowProfile(x0, x1, y0, y1){ var p = []; for (var y = y0; y < y1; y++){ var s = 0; for (var x = x0; x < x1; x++) s += lum(x, y); p.push(s / (x1 - x0)); } return p; }
    function brightest(p){ // largest run above threshold; returns [start,end) indexes into p
      var mn = Infinity, mx = -Infinity; p.forEach(function(v){ if (v < mn) mn = v; if (v > mx) mx = v; });
      var thr = mn + 0.25 * (mx - mn), best = null, s = -1;
      for (var i = 0; i <= p.length; i++){
        var on = i < p.length && p[i] >= thr;
        if (on && s < 0) s = i;
        if (!on && s >= 0){ if (!best || i - s > best[1] - best[0]) best = [s, i]; s = -1; }
      }
      return { run: best, thr: thr, mn: mn, mx: mx };
    }
    // coarse grid from the previous session, used only to place search windows
    var X0 = 0.0125, CW = 0.2422, RY = [0.0229, 0.2753, 0.5230, 0.7659], RH = 0.22;
    var boxes = [], k = 0;
    for (var r = 0; r < 4; r++) for (var cc = 0; cc < 4; cc++){
      var ax0 = Math.round((X0 + cc * CW - 0.012) * w), ax1 = Math.round((X0 + (cc + 1) * CW + 0.012) * w);
      var ay0 = Math.round((RY[r] - 0.012) * h), ay1 = Math.round((RY[r] + RH + 0.015) * h);
      ax0 = Math.max(0, ax0); ay0 = Math.max(0, ay0); ax1 = Math.min(w, ax1); ay1 = Math.min(h, ay1);
      // first pass: rows inside the window's central band to find x extents, then y extents inside those x
      var bandY0 = Math.round(ay0 + (ay1 - ay0) * 0.25), bandY1 = Math.round(ay0 + (ay1 - ay0) * 0.75);
      var px = brightest(colProfile(ax0, ax1, bandY0, bandY1));
      var x0 = ax0 + px.run[0], x1 = ax0 + px.run[1];
      var bandX0 = Math.round(x0 + (x1 - x0) * 0.15), bandX1 = Math.round(x0 + (x1 - x0) * 0.85);
      var py = brightest(rowProfile(bandX0, bandX1, ay0, ay1));
      var y0 = ay0 + py.run[0], y1 = ay0 + py.run[1];
      // second pass on x with the exact y band
      var px2 = brightest(colProfile(ax0, ax1, y0 + 4, y1 - 4));
      x0 = ax0 + px2.run[0]; x1 = ax0 + px2.run[1];
      var box = { n: ++k, x: x0 / w, y: y0 / h, w: (x1 - x0) / w, h: (y1 - y0) / h, px: [x0, y0, x1, y1] };
      boxes.push(box);
      say('cell ' + String(k).padStart(2, '0') + '  x ' + (100 * box.x).toFixed(3) + '%  y ' + (100 * box.y).toFixed(3) + '%  w ' + (100 * box.w).toFixed(3) + '%  h ' + (100 * box.h).toFixed(3) + '%   px [' + box.px.join(',') + ']  aspect ' + ((x1 - x0) / (y1 - y0)).toFixed(3) + '  thrX ' + px2.thr.toFixed(0) + ' thrY ' + py.thr.toFixed(0));
    }
    // summary: column lefts/widths per row, row tops/heights per column
    say('---');
    for (var r2 = 0; r2 < 4; r2++){ var row = boxes.slice(r2 * 4, r2 * 4 + 4); say('row ' + (r2 + 1) + ' tops ' + row.map(function(b){ return (100 * b.y).toFixed(2); }).join(' ') + '  heights ' + row.map(function(b){ return (100 * b.h).toFixed(2); }).join(' ')); }
    for (var c2 = 0; c2 < 4; c2++){ var col = [boxes[c2], boxes[4 + c2], boxes[8 + c2], boxes[12 + c2]]; say('col ' + (c2 + 1) + ' lefts ' + col.map(function(b){ return (100 * b.x).toFixed(2); }).join(' ') + '  widths ' + col.map(function(b){ return (100 * b.w).toFixed(2); }).join(' ')); }
    say('JSON ' + JSON.stringify(boxes.map(function(b){ return [+(b.x * 100).toFixed(3), +(b.y * 100).toFixed(3), +(b.w * 100).toFixed(3), +(b.h * 100).toFixed(3)]; })));
    // overlays
    var wrap = document.getElementById('wrap');
    boxes.forEach(function(b){ var d = document.createElement('div'); d.className = 'cell'; d.style.left = (100 * b.x) + '%'; d.style.top = (100 * b.y) + '%'; d.style.width = (100 * b.w) + '%'; d.style.height = (100 * b.h) + '%'; d.innerHTML = '<i>' + b.n + '</i>'; wrap.appendChild(d); });
    // crops, inset by a hair so no gutter shows
    var sheet = document.getElementById('sheet'), inset = 0.0012;
    boxes.forEach(function(b){
      var x = b.x + inset, y = b.y + inset, bw = b.w - 2 * inset, bh = b.h - 2 * inset;
      var d = document.createElement('div'); d.className = 'crop';
      d.style.aspectRatio = (bw * w) + ' / ' + (bh * h);
      d.style.backgroundImage = 'url("' + img.currentSrc + '")';
      d.style.backgroundSize = (100 / bw).toFixed(3) + '% ' + (100 / bh).toFixed(3) + '%';
      d.style.backgroundPosition = (100 * x / (1 - bw)).toFixed(3) + '% ' + (100 * y / (1 - bh)).toFixed(3) + '%';
      d.innerHTML = '<b>' + b.n + '</b>'; sheet.appendChild(d);
    });
  }
  if (img.complete && img.naturalWidth) go(); else { img.addEventListener('load', go); img.addEventListener('error', function(){ say('image failed to load'); }); }
})();
</script>
</body>
</html>
